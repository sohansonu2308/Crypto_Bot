name: Crypto Pipeline Backfill (60-Day Baseline)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing state/reports or sending Telegram alerts"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 60-day backfill pipeline
        env:
          # Reused existing repository secrets
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # New pipeline secrets
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FAST_MODEL: ${{ secrets.LLM_FAST_MODEL }}
          LLM_REASONING_MODEL: ${{ secrets.LLM_REASONING_MODEL }}
          LLM_EXTRA_HEADERS_JSON: ${{ secrets.LLM_EXTRA_HEADERS_JSON }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --mode backfill --dry-run
          else
            python -m src.main --mode backfill
          fi

      - name: Commit and push baseline state and report
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json reports/initial_baseline.md
          if git diff --cached --quiet; then
            echo "No state or report changes to commit."
          else
            git commit -m "chore: initial 60-day backfill baseline state and report"
            git push
          fi
